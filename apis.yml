apis:
  - name: Rev AI Asynchronous Speech-to-Text API
    description: Batch transcription API for pre-recorded audio files supporting uploads up to 2 GB (multipart) or 5 TB (source URL), with results typically available within 15 minutes.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.rev.ai/api/asynchronous/get-started
    baseURL: https://api.rev.ai/speechtotext/v1
    tags:
      - Transcription
      - Asynchronous
      - Batch
    properties:
      - type: Documentation
        url: https://docs.rev.ai/api/asynchronous/get-started

  - name: Rev AI Streaming Speech-to-Text API
    description: Real-time speech transcription via WebSocket connections supporting up to 10 concurrent streams with a 3-hour time limit per stream.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://docs.rev.ai/api/streaming
    baseURL: wss://api.rev.ai/speechtotext/v1/stream
    tags:
