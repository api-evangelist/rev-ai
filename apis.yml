description: >
  Rev AI is a speech recognition and transcription API platform from Rev.com that delivers
  high-accuracy AI-powered speech-to-text for pre-recorded audio and real-time streaming.
  The platform supports asynchronous batch transcription, real-time streaming via WebSocket,
  topic extraction, sentiment analysis, language identification, forced alignment, and custom
  vocabulary to improve accuracy. Rev AI uses Bearer token authentication and offers
  pay-as-you-go pricing starting at $0.10/hour for Reverb Turbo transcription, plus a free
  tier of 5 hours of credits for new accounts. Official SDKs are available for Python,
  Node.js, and Java through the revdotcom GitHub organization.
