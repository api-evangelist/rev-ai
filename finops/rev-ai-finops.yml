principles:
  - name: Understand Usage
    description: Monitor audio duration submitted per service type to forecast monthly spend. Use the jobs API to retrieve status and duration metadata for each completed transcription job.
  - name: Optimize Usage
    description: Use Reverb Turbo ($0.10/hr) instead of standard Reverb ($0.20/hr) where maximum accuracy is not required. Batch short audio clips to minimize the 15-second minimum charge impact.
  - name: Allocate Costs
    description: Tag transcription jobs with metadata (e.g., department, project, or customer ID) using the metadata field in job submissions to enable cost allocation reporting.
  - name: Forecast Spend
    description: Estimate monthly spend by multiplying expected audio hours/minutes by the applicable per-unit rate for each service. Account for the rounding policy (nearest second, 15-second minimum).
  - name: Free Tier Optimization
    description: New accounts receive 5 hours of free Reverb ASR credits applicable across all products. Prioritize testing and evaluation workloads within the free tier before incurring metered charges.
